<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />

<title>Iqro Ceria — Belajar Mengaji, Sholat & Kisah Nabi</title>

<style>
/* ==========================================================
   IQRO CERIA — stylesheet
   Palet:  krem kertas #FFF8EA | tinta ungu #2B2140
           teal utama #1B7A72 | kuning ceria #FFC93C
           koral #FF6F59 | ungu lembut #7C83FD
   Font:   Baloo 2 (judul), Nunito (isi), Amiri (huruf Arab)
   ========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap');

:root {
  --paper: #FFF8EA;
  --paper-line: #F0E4C8;
  --ink: #2B2140;
  --teal: #1B7A72;
  --teal-dark: #145b55;
  --yellow: #FFC93C;
  --coral: #FF6F59;
  --violet: #7C83FD;
  --pink: #E85D9C;
  --green: #2FA84F;
  --card-shadow: 0 6px 0 rgba(43, 33, 64, 0.15);
  --radius-lg: 26px;
  --radius-md: 18px;
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
}

body {
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 38px,
      var(--paper-line) 39px
    );
  background-attachment: local;
}

h1, h2, h3, .display {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  margin: 0;
}

.arabic {
  font-family: 'Amiri', serif;
  direction: rtl;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--violet);
  outline-offset: 3px;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 18px 18px 60px;
  min-height: 100vh;
}

/* ---------- Header ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-title {
  font-size: 26px;
  color: var(--teal-dark);
  letter-spacing: 0.5px;
}

.brand-title span {
  color: var(--coral);
}

.back-btn {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 700;
  font-family: 'Baloo 2', sans-serif;
  box-shadow: var(--card-shadow);
  transition: transform 0.15s ease;
}
.back-btn:active { transform: translateY(3px); box-shadow: none; }

/* ---------- Mascot 3D ---------- */
.mascot-wrap {

  gap: 12px;
  margin-bottom: 20px;
}

.mascot3d {

  height: 100px;

}

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(-1.5deg); }
}

.m-shadow {
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 10px;
  background: rgba(43,33,64,0.18);
  border-radius: 50%;
  filter: blur(1px);
}
.m-body {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 58px;
  height: 44px;
  background: linear-gradient(160deg, #37a99d, var(--teal) 55%, var(--teal-dark));
  border-radius: 26px 26px 20px 20px;
  box-shadow: inset -5px -6px 0 rgba(0,0,0,0.15), inset 5px 5px 0 rgba(255,255,255,0.18), var(--card-shadow);
}
.m-collar {
  position: absolute;
  top: -3px; left: 50%; transform: translateX(-50%);
  width: 26px; height: 10px;
  background: var(--yellow);
  border-radius: 0 0 10px 10px;
}
.m-book {
  position: absolute;
  bottom: 12px; left: 50%; transform: translateX(-50%);
  width: 24px; height: 17px;
  background: #FFF8EA;
  border: 2px solid var(--ink);
  border-radius: 3px;
  box-shadow: 0 2px 0 rgba(43,33,64,0.2);
}
.m-book::before {
  content: "";
  position: absolute; left: 50%; top: 1px; bottom: 1px; width: 1.5px;
  background: var(--ink);
}
.m-armL, .m-armR {
  position: absolute;
  bottom: 16px;
  width: 11px; height: 20px;
  background: var(--teal-dark);
  border-radius: 8px;
}
.m-armL { left: -3px; transform-origin: top center; animation: wave 2s ease-in-out infinite; }
.m-armR { right: -3px; transform: rotate(-22deg); }
@keyframes wave { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(32deg); } }

.m-head {
  position: absolute;
  top: 2px; left: 50%; transform: translateX(-50%);
  width: 54px; height: 50px;
  background: radial-gradient(circle at 35% 30%, #FFE3BE, #F3C185 78%);
  border-radius: 50% 50% 46% 46%;
  box-shadow: inset -6px -6px 0 rgba(0,0,0,0.07);
}
.m-peci {
  position: absolute;
  top: -10px; left: 50%; transform: translateX(-50%);
  width: 38px; height: 20px;
  background: linear-gradient(160deg, #34294d, #2b2140);
  border-radius: 50% 50% 6px 6px / 65% 65% 6px 6px;
  box-shadow: inset -3px -3px 0 rgba(255,255,255,0.08);
}
.m-peci::after {
  content: "";
  position: absolute; left: 1px; right: 1px; bottom: -3px; height: 6px;
  background: var(--yellow);
  border-radius: 0 0 4px 4px;
}
.m-cheekL, .m-cheekR {
  position: absolute; top: 27px;
  width: 10px; height: 6px;
  background: var(--coral);
  opacity: 0.45;
  border-radius: 50%;
}
.m-cheekL { left: 1px; } .m-cheekR { right: 1px; }
.m-eyeL, .m-eyeR {
  position: absolute; top: 21px;
  width: 6px; height: 7px;
  background: var(--ink);
  border-radius: 50%;
  animation: blink 4.5s ease-in-out infinite;
}
.m-eyeL { left: 15px; } .m-eyeR { right: 15px; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
.m-mouth {
  position: absolute; top: 33px; left: 50%; transform: translateX(-50%);
  width: 16px; height: 9px;
  border-bottom: 3px solid var(--ink);
  border-radius: 0 0 14px 14px;
}

.speech-bubble {
  background: #fff;
  border: 2px solid var(--ink);

  font-size: 15px;
  box-shadow: var(--card-shadow);

  flex: 1;
}
.speech-bubble::before {
  content: "";
  position: absolute;
  left: -9px;
  bottom: 14px;
  border-width: 8px 10px 8px 0;
  border-style: solid;
  border-color: transparent var(--ink) transparent transparent;
}
.speech-bubble::after {
  content: "";
  position: absolute;
  left: -6px;
  bottom: 15px;
  border-width: 7px 8px 7px 0;
  border-style: solid;
  border-color: transparent #fff transparent transparent;
}

  text-align: left;
  box-shadow: var(--card-shadow);

.book-progress {

  align-items: center;

  font-weight: 800;

.book-actions .btn-belajar { background: #fff; }

}

/* ---------- Lesson view ---------- */
.progress-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 14px 0 6px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;

}
.dot.active { background: var(--coral); transform: scale(1.3); }

.flashcard {

}

.flashcard .arabic {

}

.flashcard .latin {
  font-family: 'Baloo 2', sans-serif;

  color: var(--teal-dark);
  margin-top: 10px;

}

.flashcard .ket {

}

.speaker-btn {

}
.speaker-btn:active { transform: translateY(6px); box-shadow: none; }

}

.nav-row {

}

.btn {

}

}

// ---------------- Progress (localStorage, tanpa akun) ----------------
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }
  catch (e) { /* localStorage tidak tersedia */ }
}
function progKey(cat, modId) { return cat + ":" + modId; }
function getProgress(cat, modId) {
  const p = loadProgress();
  return p[progKey(cat, modId)] || { seen: [], selesai: false };
}
function markCardSeen(cat, modId, cardIdx) {
  const p = loadProgress();
  const key = progKey(cat, modId);
  if (!p[key]) p[key] = { seen: [], selesai: false };
  if (!p[key].seen.includes(cardIdx)) p[key].seen.push(cardIdx);
  const mod = APP_DATA[cat].modules.find((m) => m.id === modId);
  if (mod && p[key].seen.length >= mod.kartu.length) p[key].selesai = true;
  saveProgress(p);
}

// ---------------- Audio suara huruf: Web Speech API ----------------
let arabicVoice = null;
function pickArabicVoice() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  arabicVoice =
    voices.find((v) => v.lang && v.lang.toLowerCase() === "ar-sa") ||
    voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("ar")) ||
    null;
}
if (window.speechSynthesis) {
  pickArabicVoice();
  window.speechSynthesis.onvoiceschanged = pickArabicVoice;
}
function speak(text, onEnd) {
  if (!window.speechSynthesis) {
    showAudioNote("Maaf, perangkat ini tidak mendukung suara. Coba pakai Chrome ya!");
    if (onEnd) onEnd();
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ar-SA";
  if (arabicVoice) utter.voice = arabicVoice;
  utter.rate = 0.72;
  utter.pitch = 1.05;
  utter.onend = () => onEnd && onEnd();
  utter.onerror = () => {
    showAudioNote("Suara Arab belum tersedia di perangkat ini. Coba di Chrome versi terbaru (desktop/Android).");
    onEnd && onEnd();
  };
  window.speechSynthesis.speak(utter);
}
let audioNoteTimer = null;
function showAudioNote(msg) {
  const el = document.getElementById("audioNote");
  if (!el) return;
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(audioNoteTimer);
  audioNoteTimer = setTimeout(() => el.classList.add("hidden"), 4500);
}

// ---------------- Musik latar ringan (Web Audio, tanpa file audio) ----------------
let musicOn = localStorage.getItem(MUSIC_KEY) !== "off";
let audioCtx = null;
let musicMaster = null;
let musicTimer = null;
function ensureCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  return audioCtx;
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  const ctx = ensureCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume();
  musicMaster = ctx.createGain();
  musicMaster.gain.value = 0.05;
  musicMaster.connect(ctx.destination);
  const notes = [261.63, 293.66, 329.63, 392.0, 440.0, 392.0, 329.63, 293.66]; // pentatonis lembut
  let step = 0;
  musicTimer = setInterval(() => {
    if (!musicOn || !audioCtx) return;
    const freq = notes[step % notes.length];
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.3);
    o.connect(g);
    g.connect(musicMaster);
    o.start();
    o.stop(audioCtx.currentTime + 1.4);
    step++;
  }, 780);
}
function stopMusic() {
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  if (musicMaster) { try { musicMaster.disconnect(); } catch (e) {} musicMaster = null; }
}
function updateMusicPlayback() {
  if (state.view === "dashboard") startMusic();
  else stopMusic();
}
function updateMusicBtn() {
  const btn = document.getElementById("musicBtn");
  if (!btn) return;
  btn.textContent = musicOn ? "🎵" : "🔇";
  btn.classList.toggle("muted", !musicOn);
}
document.getElementById("musicBtn").addEventListener("click", () => {
  musicOn = !musicOn;
  localStorage.setItem(MUSIC_KEY, musicOn ? "on" : "off");
  updateMusicBtn();
  if (musicOn) updateMusicPlayback(); else stopMusic();
});
updateMusicBtn();
// beberapa browser memblokir autoplay audio sebelum ada interaksi pengguna;
// begitu pengguna menyentuh layar pertama kali, coba lanjutkan musik dashboard.
document.addEventListener("pointerdown", function resumeOnce() {
  const ctx = ensureCtx();
  if (ctx && ctx.state === "suspended") ctx.resume();
  updateMusicPlayback();
  document.removeEventListener("pointerdown", resumeOnce);
}, { once: true });

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function arabSizeClass(text) {
  const len = (text || "").length;
  if (len > 40) return "small";
  if (len > 16) return "medium";
  return "";
}

function render() {
  if (state.view === "dashboard") renderDashboard();

  else if (state.view === "gamehub") renderGameHub();
  else if (state.view === "quiz") renderQuiz();
  else if (state.view === "match") renderMatch();
  attachGlobalHandlers();
  updateMusicPlayback();
}

// ---------------- LESSON (flashcard) ----------------
function renderLesson() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const kartu = mod.kartu[state.cardIndex];
  const prog = getProgress(state.category, mod.id);
  const isLast = state.cardIndex === mod.kartu.length - 1;
  const sudahDilihat = prog.seen.includes(state.cardIndex);
  const arabClass = arabSizeClass(kartu.arab);

  const dots = mod.kartu.map((_, i) => {
    const cls = i === state.cardIndex ? "active" : prog.seen.includes(i) ? "done" : "";
    return `<span class="dot ${cls}"></span>`;
  }).join("");

  root.innerHTML = `
    ${topbar(mod.judul, true)}
    ${mascot(`${mod.tujuan}`)}
    <div class="progress-dots">${dots}</div>
    <div class="flashcard">
      <div class="arabic ${arabClass}">${kartu.arab}</div>
      <div class="latin">${kartu.latin}</div>
      <div class="ket">${kartu.ket}</div>
      <button class="speaker-btn" id="btnSpeak" aria-label="Dengarkan pelafalan">🔊</button>
    </div>
    <div class="audio-note hidden" id="audioNote"></div>
    <div class="aku-bisa-row">
      <button class="btn btn-ok" id="btnBisa">${sudahDilihat ? "✓ Sudah aku pelajari" : "Aku bisa! ✔️"}</button>
    </div>
    <div class="nav-row">
      <button class="btn btn-secondary" id="btnPrev" ${state.cardIndex === 0 ? "disabled" : ""}>⬅ Sebelumnya</button>
      ${isLast ? `<button class="btn btn-primary" id="btnGame">Main Yuk! 🎮</button>` : `<button class="btn btn-primary" id="btnNext">Selanjutnya ➡</button>`}
    </div>
  `;

  document.getElementById("btnSpeak").addEventListener("click", (e) => {
    e.currentTarget.classList.add("speaking");
    speak(kartu.arab, () => e.currentTarget.classList.remove("speaking"));
  });
  document.getElementById("btnBisa").addEventListener("click", () => {
    markCardSeen(state.category, mod.id, state.cardIndex);
    render();
  });
  document.getElementById("btnPrev").addEventListener("click", () => {
    if (state.cardIndex > 0) { state.cardIndex -= 1; render(); }
  });
  const btnNext = document.getElementById("btnNext");
  if (btnNext) btnNext.addEventListener("click", () => { state.cardIndex += 1; render(); });
  const btnGame = document.getElementById("btnGame");
  if (btnGame) btnGame.addEventListener("click", () => { state.view = "gamehub"; render(); });
}

function startQuiz(jilidId) {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === jilidId);
  const totalSoal = Math.min(5, mod.kartu.length);
  const pool = shuffle(mod.kartu.map((k, i) => i)).slice(0, totalSoal);
  state.view = "quiz";
  state.jilidId = jilidId;
  state.quiz = { pool, index: 0, score: 0, total: totalSoal, answered: false };
  render();
}
function renderQuiz() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const q = state.quiz;
  if (q.index >= q.total) { renderCelebration(mod, { score: q.score, total: q.total }, "quiz"); return; }

  const cardIdx = q.pool[q.index];
  const kartu = mod.kartu[cardIdx];
  const distractorPool = mod.kartu.map((k, i) => i).filter((i) => i !== cardIdx);
  const distractors = shuffle(distractorPool).slice(0, Math.min(3, distractorPool.length));
  const options = shuffle([cardIdx, ...distractors]);
  const isAudio = cat.quizMode !== "text";

  root.innerHTML = `
    ${topbar(mod.judul + " · Kuis", true)}
    ${mascot(isAudio ? "Dengarkan suaranya, lalu pilih tulisan yang cocok ya! 🎧" : "Baca petunjuknya, lalu tebak jawabannya ya! 🕵️")}
    <div class="quiz-card">
      <div class="quiz-question">Soal ${q.index + 1} dari ${q.total}</div>
      ${isAudio ? `<button class="speaker-btn" id="btnSpeakQuiz" aria-label="Dengarkan pelafalan">🔊</button>` : `<div class="clue-box">${kartu.ket}</div>`}
      <div class="quiz-options" id="quizOptions">
        ${options.map((i) => `<button class="quiz-opt" data-idx="${i}">${mod.kartu[i].latin}</button>`).join("")}
      </div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <div style="margin-top:10px"><span class="quiz-score">⭐ ${q.score}/${q.total}</span></div>
    </div>
    <div class="audio-note hidden" id="audioNote"></div>
  `;

  if (isAudio) {
    const speakBtn = document.getElementById("btnSpeakQuiz");
    const doSpeak = () => { speakBtn.classList.add("speaking"); speak(kartu.arab, () => speakBtn.classList.remove("speaking")); };
    speakBtn.addEventListener("click", doSpeak);
    setTimeout(doSpeak, 300);
  }

  document.querySelectorAll(".quiz-opt").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (q.answered) return;
      q.answered = true;
      const chosen = Number(btn.dataset.idx);
      const feedback = document.getElementById("quizFeedback");
      if (chosen === cardIdx) {
        btn.classList.add("correct");
        q.score += 1;
        feedback.textContent = pick(MASKOT_KATA.benar);
      } else {
        btn.classList.add("wrong");
        document.querySelector(`.quiz-opt[data-idx="${cardIdx}"]`).classList.add("correct");
        feedback.textContent = pick(MASKOT_KATA.salah);
      }
      setTimeout(() => { q.index += 1; q.answered = false; renderQuiz(); }, 1400);
    });
  });
}

// ---------------- GAME: Cocok Kartu (memory match) ----------------
function startMatch(jilidId) {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === jilidId);
  const n = Math.min(6, mod.kartu.length);
  const chosen = shuffle(mod.kartu.map((k, i) => i)).slice(0, n);
  let cards = [];
  chosen.forEach((idx) => {
    cards.push({ uid: idx + "-a", idx, type: "arab" });
    cards.push({ uid: idx + "-l", idx, type: "latin" });
  });
  cards = shuffle(cards);
  state.view = "match";
  state.jilidId = jilidId;
  state.match = { cards, flipped: [], matched: [], moves: 0, busy: false, total: n };
  render();
}
function renderMatch() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const m = state.match;

  if (m.matched.length === m.cards.length) {
    const maxMoves = m.total + 2;
    let stars = 1;
    if (m.moves <= maxMoves) stars = 3;
    else if (m.moves <= maxMoves + 3) stars = 2;
    renderCelebration(mod, { moves: m.moves, stars }, "match");
    return;
  }

  root.innerHTML = `
    ${topbar(mod.judul + " · Cocok Kartu", true)}
    ${mascot("Buka dua kartu, cari pasangannya! 🧩")}
    <div class="match-stats">
      <span class="pill">🔁 Langkah: ${m.moves}</span>
      <span class="pill">✅ ${m.matched.length / 2}/${m.total} pasang</span>
    </div>
    <div class="match-grid" id="matchGrid">
      ${m.cards.map((c, pos) => {
        const isMatched = m.matched.includes(c.uid);
        const isFlipped = m.flipped.some((f) => f.uid === c.uid) || isMatched;
        const label = isFlipped
          ? (c.type === "arab" ? mod.kartu[c.idx].arab : mod.kartu[c.idx].latin)
          : "❓";
        const faceClass = isFlipped ? (c.type === "arab" ? "face-arab" : "face-latin") : "";
        return `<button class="match-card ${isFlipped ? "flipped" : ""} ${isMatched ? "matched" : ""} ${faceClass}"
                  data-pos="${pos}" ${isMatched ? "disabled" : ""}>${label}</button>`;
      }).join("")}
    </div>
    <div class="audio-note hidden" id="audioNote"></div>
  `;

  document.querySelectorAll(".match-card").forEach((btn) => {
    btn.addEventListener("click", () => onMatchCardClick(Number(btn.dataset.pos)));
  });
}
function onMatchCardClick(pos) {
  const m = state.match;
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  if (m.busy) return;
  const card = m.cards[pos];
  if (m.matched.includes(card.uid)) return;
  if (m.flipped.some((f) => f.uid === card.uid)) return;
  if (m.flipped.length >= 2) return;

  m.flipped.push(card);
  render();

  if (m.flipped.length === 2) {
    m.busy = true;
    m.moves += 1;
    const [a, b] = m.flipped;
    const isMatch = a.idx === b.idx && a.type !== b.type;
    if (isMatch) {
      setTimeout(() => {
        m.matched.push(a.uid, b.uid);
        m.flipped = [];
        m.busy = false;
        speak(mod.kartu[a.idx].arab);
        render();
      }, 500);
    } else {
      setTimeout(() => {
        m.flipped = [];
        m.busy = false;
        render();
      }, 900);
    }
  }
}

// ---------------- Celebration ----------------
function renderCelebration(mod, result, kind) {
  const isQuiz = kind === "quiz";
  const title = isQuiz ? "Kuis Selesai!" : "Semua Kartu Cocok!";
  const desc = isQuiz
    ? `Skor kamu: ${result.score} dari ${result.total} (${Math.round((result.score / result.total) * 100)}%)`
    : `Selesai dalam ${result.moves} langkah — ${"⭐".repeat(result.stars)}`;

  root.innerHTML = `
    ${topbar(mod.judul, true)}
    ${mascot(pick(MASKOT_KATA.selesaiJilid))}
    <div class="celebrate">
      <div class="celebrate-card">
        <div class="big-star">🏆</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <button class="btn btn-primary" id="btnUlangi">Main Lagi 🔁</button>
        <button class="btn btn-secondary" id="btnGameLain">Main Game Lain 🎮</button>
        <button class="btn btn-secondary" id="btnKeRak">Kembali ke Rak 📚</button>
      </div>
    </div>
  `;
  document.getElementById("btnUlangi").addEventListener("click", () => {
    if (isQuiz) startQuiz(mod.id); else startMatch(mod.id);
  });
  document.getElementById("btnGameLain").addEventListener("click", () => { state.view = "gamehub"; render(); });
  document.getElementById("btnKeRak").addEventListener("click", () => { state.view = "category-home"; render(); });
}

// ---------------- Global handlers ----------------
function attachGlobalHandlers() {
  const back = document.getElementById("btnBack");
  if (back) {
    back.addEventListener("click", () => {
      if (state.view === "quiz" || state.view === "match") state.view = "gamehub";
      else if (state.view === "gamehub" || state.view === "lesson") state.view = "category-home";
      else state.view = "dashboard";
      render();
    });
  }
}

render();
</script>

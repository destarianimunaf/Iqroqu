<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Iqro Ceria — Belajar Mengaji, Sholat & Kisah Nabi</title>
<meta name="description" content="Aplikasi belajar Islam interaktif untuk anak-anak: Iqro jilid 1-6 sampai Al-Qur'an, belajar sholat, tajwid, dan kisah 25 nabi. Ringan, lucu, dan bisa dipakai di HP manapun." />
<style>
/* ==========================================================
   IQRO CERIA — stylesheet
   Palet:  krem kertas #FFF8EA | tinta ungu #2B2140
           teal utama #1B7A72 | kuning ceria #FFC93C
           koral #FF6F59 | ungu lembut #7C83FD
   Font:   Baloo 2 (judul), Nunito (isi), Amiri (huruf Arab)
   ========================================================== */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap');

:root {
  --paper: #FFF8EA;
  --paper-line: #F0E4C8;
  --ink: #2B2140;
  --teal: #1B7A72;
  --teal-dark: #145b55;
  --yellow: #FFC93C;
  --coral: #FF6F59;
  --violet: #7C83FD;
  --pink: #E85D9C;
  --green: #2FA84F;
  --card-shadow: 0 6px 0 rgba(43, 33, 64, 0.15);
  --radius-lg: 26px;
  --radius-md: 18px;
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
}

body {
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 38px,
      var(--paper-line) 39px
    );
  background-attachment: local;
}

h1, h2, h3, .display {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  margin: 0;
}

.arabic {
  font-family: 'Amiri', serif;
  direction: rtl;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--violet);
  outline-offset: 3px;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 18px 18px 60px;
  min-height: 100vh;
}

/* ---------- Header ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 18px;
  padding-right: 52px; /* ruang supaya tidak ketutup tombol musik mengambang */
}
.topbar .brand-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
  flex: 1;
  text-align: right;
}
.topbar .brand { flex-shrink: 0; }
.stat-pills { display: flex; gap: 6px; flex-shrink: 0; }
.stat-pill {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 13px;
  border-radius: 999px;
  padding: 5px 10px;
  box-shadow: var(--card-shadow);
  white-space: nowrap;
}
.stat-pill.streak { background: #fff; color: var(--coral); border: 2px solid var(--coral); }
.stat-pill.xp { background: #fff; color: var(--teal-dark); border: 2px solid var(--teal-dark); }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-title {
  font-size: 26px;
  color: var(--teal-dark);
  letter-spacing: 0.5px;
}

.brand-title span {
  color: var(--coral);
}

.back-btn {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 8px 16px;
  font-weight: 700;
  font-family: 'Baloo 2', sans-serif;
  box-shadow: var(--card-shadow);
  transition: transform 0.15s ease;
  white-space: nowrap;
  flex-shrink: 0;
}
.back-btn:active { transform: translateY(3px); box-shadow: none; }

/* ---------- Mascot (ilustrasi SVG bergaya, banyak pose) ---------- */
.mascot-wrap {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  margin-bottom: 20px;
}

.mascot-illust {
  width: 84px;
  height: 104px;
  flex-shrink: 0;
  filter: drop-shadow(0 6px 4px rgba(43,33,64,0.18));
  animation: bob 2.8s ease-in-out infinite;
}
.mascot-illust.big { width: 132px; height: 164px; }
.mascot-illust svg { width: 100%; height: 100%; display: block; overflow: visible; }
.mascot-mini { flex-shrink: 0; }
.mascot-mini .mascot-illust { width: 40px; height: 50px; animation-duration: 3.4s; }
.corner-mascot-block {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 4px;
}
.corner-mascot-block .mascot-illust.big { width: 108px; height: 134px; }
.corner-mascot-note {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--teal-dark);
  background: #fff;
  border: 2px dashed var(--teal-dark);
  border-radius: var(--radius-md);
  padding: 10px 14px;
}

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(-1.5deg); }
}
.mas-blink { animation: mblink 4.5s ease-in-out infinite; transform-origin: center; }
@keyframes mblink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
.mas-armwave { animation: mwave 2s ease-in-out infinite; transform-origin: top center; }
@keyframes mwave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
.mas-sparkle { animation: msparkle 1.8s ease-in-out infinite; transform-origin: center; }
.mas-sparkle.s2 { animation-delay: .5s; }
.mas-sparkle.s3 { animation-delay: 1s; }
@keyframes msparkle { 0%,100% { opacity:.25; transform:scale(0.7); } 50% { opacity:1; transform:scale(1.15); } }
.mas-float { animation: mfloat 3.2s ease-in-out infinite; }
@keyframes mfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* ---------- Panggung ilustrasi (hero dashboard) ---------- */
.hero-stage {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  padding: 26px 18px 10px;
  margin-bottom: 6px;
  background: linear-gradient(180deg, #2b3a6b 0%, #4a4184 55%, #6b4f9e 100%);
}
.hero-stage svg.hero-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-stage .mascot-illust { position: relative; z-index: 2; margin: 0 auto; }
.hero-star { animation: msparkle 2.4s ease-in-out infinite; }
.hero-star.d1 { animation-delay: .3s; } .hero-star.d2 { animation-delay: .9s; } .hero-star.d3 { animation-delay: 1.5s; }

.speech-bubble {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  font-weight: 700;
  font-size: 15px;
  box-shadow: var(--card-shadow);
  position: relative;
  flex: 1;
}
.speech-bubble::before {
  content: "";
  position: absolute;
  left: -9px;
  bottom: 14px;
  border-width: 8px 10px 8px 0;
  border-style: solid;
  border-color: transparent var(--ink) transparent transparent;
}
.speech-bubble::after {
  content: "";
  position: absolute;
  left: -6px;
  bottom: 15px;
  border-width: 7px 8px 7px 0;
  border-style: solid;
  border-color: transparent #fff transparent transparent;
}

/* ---------- Floating music button ---------- */
.music-btn {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 60;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--ink);
  box-shadow: var(--card-shadow);
  font-size: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease;
}
.music-btn:active { transform: translateY(3px); box-shadow: none; }
.music-btn.muted { opacity: 0.5; }

/* ---------- Tema gelap ala Lingokids (dashboard, jalur kategori, progres) ---------- */
body.dash-theme {
  background: radial-gradient(120% 90% at 15% 0%, #4a3a86 0%, #2c2154 45%, #201638 100%);
}
body.dash-theme .app { padding-bottom: 100px; }
body.dash-theme .brand-title { color: #fff; }
body.dash-theme .brand-title span { color: var(--yellow); }
body.dash-theme .menu-section-title,
body.dash-theme .shelf-label { color: #fff; }
body.dash-theme .footer-note { color: rgba(255,255,255,0.5); }
body.dash-theme .duo-node-label { color: #fff; }
body.dash-theme .duo-node-progress { color: rgba(255,255,255,0.72); }
body.dash-theme .duo-path::before { border-left-color: rgba(255,255,255,0.22); }
body.dash-theme .back-btn { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.5); }
body.dash-theme .corner-mascot-note { color: var(--teal-dark); }

.dash-greet {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 0 20px;
}
.dash-greet .mascot-illust { width: 40px; height: 50px; }
.dash-greet p { margin: 0; font-weight: 700; color: #fff; font-size: 15px; }

.mascot-picker {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 22px;
}
.mp-label {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  flex-shrink: 0;
}
.mp-options { display: flex; gap: 10px; }
.mp-opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  border-radius: 14px;
  border: 2px solid transparent;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.mp-opt .mascot-illust { width: 32px; height: 40px; }
.mp-opt span { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 10.5px; color: rgba(255,255,255,0.75); }
.mp-opt.active { border-color: var(--yellow); background: rgba(255,255,255,0.1); }
.mp-opt.active span { color: #fff; }
.mp-opt:active { transform: scale(0.94); }

.brand-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, #5b6cf5, var(--violet));
  color: #fff;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 13px;
  border-radius: 999px;
  padding: 8px 14px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.18);
  white-space: nowrap;
}

/* ---------- Baris scroll horizontal: Pilihan Harian ---------- */
.scroll-row {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 4px 4px 14px;
  margin: 0 -4px 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.scroll-row::-webkit-scrollbar { display: none; }

.pick-card {
  scroll-snap-align: start;
  flex: 0 0 auto;
  width: 168px;
  height: 190px;
  border-radius: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 0 rgba(0,0,0,0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease;
}
.pick-card:active { transform: translateY(5px); }
.pick-card .pc-icon {
  font-size: 64px;
  filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2));
}
.pick-card .pc-label {
  position: absolute;
  left: 10px;
  bottom: 10px;
  right: 10px;
  background: rgba(255,255,255,0.94);
  color: var(--ink);
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 13.5px;
  border-radius: 12px;
  padding: 8px 10px;
  text-align: left;
  line-height: 1.15;
}
.pick-card .pc-star {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.28);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  border-radius: 999px;
  padding: 3px 8px;
}

/* ---------- Baris scroll horizontal: Dunia untuk Dijelajahi ---------- */
.world-item {
  scroll-snap-align: start;
  flex: 0 0 auto;
  width: 92px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: transform 0.12s ease;
}
.world-item:active { transform: scale(0.94); }
.world-circle {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  box-shadow: 0 6px 0 rgba(0,0,0,0.22), inset 0 0 0 3px rgba(255,255,255,0.25);
}
.world-item .wi-label {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 11.5px;
  color: #fff;
  text-align: center;
  line-height: 1.15;
}

/* ---------- Grid kartu kategori (gaya "Pilihan Harian") ---------- */
.picks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
  margin-bottom: 8px;
}
.pick-card2 {
  border-radius: 22px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 8px 0 rgba(0,0,0,0.22);
  display: flex;
  flex-direction: column;
  text-align: left;
  transition: transform 0.12s ease;
  opacity: 0;
  animation: cardIn 0.5s ease forwards;
}
.pick-card2:nth-child(1) { animation-delay: .05s; }
.pick-card2:nth-child(2) { animation-delay: .12s; }
.pick-card2:nth-child(3) { animation-delay: .19s; }
.pick-card2:nth-child(4) { animation-delay: .26s; }
.pick-card2:nth-child(5) { animation-delay: .33s; }
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.pick-card2:active { transform: translateY(5px); }
.pc2-illust {
  aspect-ratio: 1 / 0.82;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  position: relative;
  overflow: hidden;
}
.pc2-illust img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  padding: 6px;
  animation: illustFloat 3.4s ease-in-out infinite;
  filter: drop-shadow(0 6px 4px rgba(0,0,0,0.15));
}
.pc2-illust .pc2-deco {
  position: absolute;
  font-size: 15px;
  opacity: 0.85;
}
@keyframes illustFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-6px) rotate(-1.5deg); }
}
.pc2-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  background: #fff;
}
.pc2-label span:first-child {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.15;
}
.pc2-star {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  flex-shrink: 0;
  box-shadow: 0 2px 0 rgba(0,0,0,0.18);
}

/* ---------- Hero maskot dashboard baru (foto Raqi) ---------- */
.dash-hero2 {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  margin: 4px 0 26px;
}
.dash-hero2 .mascot-illust { width: 110px; height: 138px; }
.hero-photo-wrap { display: flex; justify-content: center; }
.hero-photo {
  width: 148px;
  height: auto;
  animation: heroBob 3.2s ease-in-out infinite;
  filter: drop-shadow(0 10px 8px rgba(0,0,0,0.28));
}
@keyframes heroBob {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-10px) rotate(1deg); }
}
.dash-hero2 .speech-bubble {
  max-width: 250px;
  text-align: center;
}
.dash-hero2 .speech-bubble::before,
.dash-hero2 .speech-bubble::after { display: none; }
.mascot-ribbon {
  background: linear-gradient(135deg, var(--violet), #6b46c9);
  color: #fff;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 13px;
  padding: 8px 22px;
  border-radius: 8px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.22);
  position: relative;
  margin-top: 2px;
}
.mascot-ribbon::before, .mascot-ribbon::after {
  content: "";
  position: absolute;
  top: 0;
  border-top: 18px solid #4d2f94;
  width: 0; height: 0;
}
.mascot-ribbon::before { left: -10px; border-right: 10px solid transparent; }
.mascot-ribbon::after { right: -10px; border-left: 10px solid transparent; }

/* ---------- Halaman Favorit (lanjutkan belajar) ---------- */
.favorit-intro { color: rgba(255,255,255,0.7); font-weight: 700; font-size: 13px; margin: -8px 0 18px; }

/* ---------- Halaman Pengaturan ---------- */
.settings-block { margin-bottom: 26px; }
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.settings-row .sr-text { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px; color: #fff; }
.settings-row .sr-sub { font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,0.55); margin-top: 2px; }
.toggle-switch {
  width: 46px; height: 26px;
  border-radius: 999px;
  background: rgba(255,255,255,0.22);
  position: relative;
  flex-shrink: 0;
  transition: background 0.15s ease;
}
.toggle-switch::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s ease;
}
.toggle-switch.on { background: var(--green); }
.toggle-switch.on::after { transform: translateX(20px); }
.btn-danger {
  width: 100%;
  background: rgba(255,111,89,0.16);
  color: #ff8a75;
  border: 2px solid rgba(255,111,89,0.4);
  border-radius: var(--radius-md);
  padding: 13px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 14px;
}
.btn-danger:active { transform: translateY(2px); }

/* ---------- Bottom nav ---------- */
.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  width: calc(100% - 28px);
  max-width: 460px;
  background: rgba(24, 16, 46, 0.92);
  backdrop-filter: blur(6px);
  border-radius: 999px;
  display: flex;
  justify-content: space-around;
  padding: 8px 4px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.35);
  z-index: 55;
}
.bn-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  border-radius: 999px;
  color: rgba(255,255,255,0.6);
  transition: background 0.15s ease, color 0.15s ease;
}
.bn-item .bn-icon { font-size: 18px; }
.bn-item .bn-label { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 9.5px; }
.bn-item.active { background: rgba(255,255,255,0.16); color: #fff; }
.bottom-nav-spacer { height: 70px; }

/* ---------- Halaman Progres ---------- */
.progress-hero { display: flex; gap: 12px; margin: 4px 0 20px; }
.ph-stat {
  flex: 1;
  background: rgba(255,255,255,0.1);
  border-radius: var(--radius-md);
  padding: 16px;
  text-align: center;
}
.ph-num { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; color: #fff; }
.ph-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.65); margin-top: 2px; }
.prog-list { display: flex; flex-direction: column; gap: 14px; }
.prog-row { display: flex; align-items: center; gap: 12px; }
.prog-icon {
  width: 50px; height: 50px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
  box-shadow: 0 4px 0 rgba(0,0,0,0.2);
}
.prog-info { flex: 1; min-width: 0; }
.prog-label { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 4px; }
.prog-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 999px; }
.prog-pct { font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,0.6); margin-top: 4px; }

/* ---------- Dashboard ---------- */
.dash-hero {
  background: linear-gradient(135deg, var(--violet), var(--pink));
  border-radius: 38px 38px 60px 60px / 38px 38px 46px 46px;
  padding: 26px 22px;
  color: #fff;
  margin-bottom: 26px;
  box-shadow: 0 9px 0 rgba(43,33,64,0.22);
  position: relative;
  overflow: hidden;
}
.dash-hero h2 { font-size: 23px; margin-bottom: 6px; }
.dash-hero p { margin: 0; font-weight: 600; opacity: 0.95; position: relative; z-index: 1; }

.menu-section-title {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 19px;
  color: var(--teal-dark);
  margin: 4px 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 14px;
  position: relative;
}
@media (min-width: 480px) {
  .menu-grid { grid-template-columns: repeat(4, 1fr); }
}
.menu-tile {
  border-radius: 40% 60% 58% 42% / 48% 42% 58% 52%;
  padding: 22px 16px 18px;
  color: #fff;
  text-align: left;
  box-shadow: 0 9px 0 rgba(43,33,64,0.26);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 172px;
  transition: transform 0.15s cubic-bezier(.34,1.6,.64,1), box-shadow 0.15s ease, border-radius 0.3s ease;
  position: relative;
}
.menu-tile:nth-child(odd) { transform: rotate(-1.6deg); }
.menu-tile:nth-child(even) { transform: rotate(1.8deg); }
.menu-tile:active {
  transform: translateY(7px) scale(0.96) rotate(0deg) !important;
  box-shadow: 0 2px 0 rgba(43,33,64,0.26);
  border-radius: var(--radius-lg);
}
.menu-tile .m-icon {
  font-size: 40px;
  display: inline-block;
  animation: iconBounce 2.6s ease-in-out infinite;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,0.15));
}
.menu-tile:nth-child(2) .m-icon { animation-delay: .3s; }
.menu-tile:nth-child(3) .m-icon { animation-delay: .6s; }
.menu-tile:nth-child(4) .m-icon { animation-delay: .9s; }
.menu-tile:nth-child(5) .m-icon { animation-delay: 1.2s; }
@keyframes iconBounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(-6deg); }
}
.menu-tile h3 { font-size: 17px; margin: 2px 0 0; line-height: 1.15; }
.menu-tile p { font-size: 11.5px; font-weight: 700; margin: 0; opacity: 0.95; }
.menu-tile .m-progress {
  margin-top: auto;
  font-size: 11px;
  font-weight: 800;
  background: rgba(255,255,255,0.28);
  border-radius: 999px;
  padding: 4px 11px;
  width: fit-content;
}
.tile-badge {
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 20px;
  animation: iconBounce 2s ease-in-out infinite;
}
.tile-iqro { background: linear-gradient(150deg, #26a89a, var(--violet)); }
.tile-sholat { background: linear-gradient(150deg, var(--coral), #ffb14c); }
.tile-tajwid { background: linear-gradient(150deg, var(--violet), var(--pink)); }
.tile-nabi { background: linear-gradient(150deg, var(--green), #2fc9a8); }
.tile-arab { background: linear-gradient(150deg, #FF9F43, var(--coral)); }
.menu-grid .menu-tile:nth-child(5):last-child {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  gap: 14px;
  min-height: 108px;
  border-radius: 34px 60px 60px 34px / 50% 50% 50% 50%;
}
.menu-grid .menu-tile:nth-child(5):last-child .m-icon { font-size: 46px; }
.menu-grid .menu-tile:nth-child(5):last-child .m-text { flex: 1; }
.menu-grid .menu-tile:nth-child(5):last-child .m-progress { margin-top: 0; flex-shrink: 0; }

/* ---------- Dekorasi mengambang (nuansa playful gaya app anak) ---------- */
.floaty-layer {
  position: relative;
  height: 0;
}
.floaty {
  position: absolute;
  opacity: 0.55;
  animation: floatY 5s ease-in-out infinite;
  pointer-events: none;
  user-select: none;
}
@keyframes floatY {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-14px) rotate(8deg); }
}

/* ---------- Home: bookshelf ---------- */
.intro-card {
  border-radius: var(--radius-lg);
  padding: 22px;
  color: #fff;
  margin-bottom: 24px;
  box-shadow: var(--card-shadow);
}
.intro-card h2 { font-size: 22px; margin-bottom: 6px; }
.intro-card p { margin: 0; font-weight: 600; opacity: 0.95; }

.intro-progress-bar {
  margin-top: 14px;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.35);
  overflow: hidden;
}
.intro-progress-fill {
  height: 100%;
  background: #fff;
  border-radius: 999px;
  transition: width 0.4s ease;
}

.shelf-label {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--teal-dark);
  margin: 8px 0 12px;
}

/* ---------- Jalur belajar (path ala Duolingo) ---------- */
.duo-path {
  position: relative;
  padding: 12px 0 24px;
}
.duo-path::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 10px;
  bottom: 10px;
  border-left: 4px dashed var(--paper-line);
  transform: translateX(-50%);
  z-index: 0;
}
.duo-node-row {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  margin-bottom: 6px;
}
.duo-node-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.duo-node {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: var(--node-color, var(--teal));
  box-shadow: 0 7px 0 rgba(43,33,64,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  position: relative;
}
.duo-node:active { transform: translateY(6px); box-shadow: 0 1px 0 rgba(43,33,64,0.25); }
.duo-node-icon { font-size: 28px; color: #fff; }
.duo-node.done { background: var(--green); }
.duo-node.done .duo-node-icon { font-size: 30px; }
.duo-node.locked {
  background: #D8CFB8;
  box-shadow: 0 7px 0 rgba(43,33,64,0.12);
  cursor: not-allowed;
}
.duo-node.locked .duo-node-icon { font-size: 24px; opacity: 0.8; }
.duo-node-ring {
  position: absolute;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: 3px dashed var(--coral);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: ringspin 6s linear infinite;
}
@keyframes ringspin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
.duo-node-label {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
  text-align: center;
  max-width: 96px;
}
.duo-node-progress {
  font-size: 10.5px;
  font-weight: 800;
  color: #8A7F9C;
}
.duo-node-game {
  margin-top: 2px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--ink);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 0 rgba(43,33,64,0.15);
}
.duo-node-game:active { transform: translateY(2px); box-shadow: none; }

.bookshelf {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

@media (min-width: 520px) {
  .bookshelf { grid-template-columns: repeat(3, 1fr); }
}

.book {
  border-radius: var(--radius-md);
  padding: 16px 14px;
  color: #fff;
  text-align: left;
  box-shadow: var(--card-shadow);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 140px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.book-jilid { font-family: 'Baloo 2'; font-size: 20px; }
.book-deskripsi { font-size: 13px; font-weight: 700; opacity: 0.95; }
.book-progress {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 800;
  background: rgba(255,255,255,0.25);
  border-radius: 999px;
  padding: 4px 10px;
  width: fit-content;
}
.book-actions {
  margin-top: auto;
  display: flex;
  gap: 6px;
}
.book-actions button {
  flex: 1;
  border-radius: 999px;
  padding: 7px 6px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 12.5px;
  background: rgba(255,255,255,0.9);
  color: var(--ink);
  transition: transform 0.12s ease;
}
.book-actions button:active { transform: translateY(2px); }
.book-actions .btn-belajar { background: #fff; }
.book-actions .btn-main { background: rgba(255,255,255,0.55); }
.book-selesai::after {
  content: "✓ Selesai";
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 11px;
  font-weight: 800;
  background: #fff;
  color: var(--green);
  border-radius: 999px;
  padding: 2px 8px;
}

/* ---------- Lesson view ---------- */
.progress-dots {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 14px 0 6px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #E6DCC0;
}
.dot.active { background: var(--coral); transform: scale(1.3); }
.dot.done { background: var(--green); }

.flashcard {
  background: #fff;
  border: 3px dashed var(--ink);
  border-radius: var(--radius-lg);
  padding: 30px 18px 26px;
  text-align: center;
  box-shadow: var(--card-shadow);
  margin: 14px 0;
}

.flashcard .arabic {
  font-size: 68px;
  line-height: 1.4;
  color: var(--ink);
  word-break: break-word;
}
.flashcard .arabic.medium { font-size: 40px; }
.flashcard .arabic.small { font-size: 27px; line-height: 1.7; }

.flashcard .latin {
  font-family: 'Baloo 2', sans-serif;
  font-size: 20px;
  color: var(--teal-dark);
  margin-top: 10px;
  letter-spacing: 0.5px;
}

.flashcard .ket {
  font-size: 14px;
  font-weight: 700;
  color: #8A7F9C;
  margin-top: 6px;
}

.speaker-btn {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: var(--coral);
  color: #fff;
  font-size: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 18px auto 0;
  box-shadow: 0 6px 0 #C94A3B;
  transition: transform 0.12s ease;
}
.speaker-btn:active { transform: translateY(6px); box-shadow: none; }
.speaker-btn.speaking { animation: pulse 0.6s ease infinite; }

.audio-tools-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 12px;
}
.audio-tool-btn {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 7px 14px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 12.5px;
  color: var(--ink);
  box-shadow: 0 3px 0 rgba(43,33,64,0.2);
  transition: transform 0.12s ease;
}
.audio-tool-btn:active { transform: translateY(3px); box-shadow: none; }

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.nav-row {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.btn {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 16px;
  border-radius: 999px;
  padding: 14px 18px;
  box-shadow: var(--card-shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  flex: 1;
}
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn-primary { background: var(--teal); color: #fff; }
.btn-secondary { background: #fff; color: var(--ink); border: 2px solid var(--ink); }
.btn-ok { background: var(--yellow); color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.aku-bisa-row { text-align: center; margin-top: 12px; }
.aku-bisa-row .btn { flex: none; padding: 12px 28px; }

/* ---------- Game hub ---------- */
.game-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}
.game-tile {
  border-radius: var(--radius-lg);
  padding: 18px 14px;
  color: #fff;
  text-align: left;
  box-shadow: var(--card-shadow);
  transition: transform 0.12s ease;
}
.game-tile:active { transform: translateY(4px); }
.game-tile .icon { font-size: 30px; }
.game-tile h3 { font-size: 15.5px; margin: 6px 0 3px; line-height: 1.15; }
.game-tile p { margin: 0; font-size: 11.5px; font-weight: 700; opacity: 0.95; }
.game-tile.quiz { background: linear-gradient(135deg, var(--coral), var(--pink)); }
.game-tile.match { background: linear-gradient(135deg, var(--violet), var(--teal)); }
.game-tile.order { background: linear-gradient(135deg, var(--yellow), var(--coral)); }
.game-tile.tf { background: linear-gradient(135deg, var(--green), #57c2a8); }
.game-tile.sheet { background: linear-gradient(135deg, #FF9F43, #FFC93C); }

/* ---------- Lembar Latihan (worksheet) ---------- */
.worksheet-paper {
  background: #fffdf6;
  border-radius: 16px;
  padding: 20px 18px 22px 44px;
  position: relative;
  box-shadow: var(--card-shadow);
  background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 36px, var(--paper-line) 37px);
  margin: 14px 0;
  border: 2px solid #EDE0C0;
}
.worksheet-paper::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 34px;
  width: 2px;
  background: #FF9FB0;
  opacity: 0.6;
}
.worksheet-holes {
  position: absolute;
  left: 10px;
  top: 18px;
  bottom: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.worksheet-holes span {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--paper);
  border: 2px solid #E4D7B8;
  display: block;
}
.ws-title {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: var(--teal-dark);
  margin-bottom: 4px;
}
.ws-instruction {
  font-size: 12px;
  font-weight: 700;
  color: #8A7F9C;
  margin-bottom: 16px;
}
.ws-q { margin-bottom: 18px; }
.ws-q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.ws-q-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  font-weight: 800;
  font-family: 'Baloo 2', sans-serif;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}
.ws-q-num.correct { background: var(--green); }
.ws-q-num.wrong { background: var(--coral); }
.ws-q-arab { font-family: 'Amiri', serif; font-size: 30px; direction: rtl; }
.ws-q-arab.medium { font-size: 22px; }
.ws-q-arab.small { font-size: 16px; }
.ws-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-left: 36px;
}
.ws-opt {
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 8px 10px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 12.5px;
  background: #fff;
  text-align: left;
  transition: transform 0.1s ease;
}
.ws-opt:active { transform: scale(0.96); }
.ws-opt.selected { background: var(--yellow); }
.ws-opt.correct { background: var(--green); color: #fff; border-color: var(--green); }
.ws-opt.wrong { background: var(--coral); color: #fff; border-color: var(--coral); }
.ws-submit-row { text-align: center; margin-top: 6px; }
.ws-submit-row .btn { width: 100%; max-width: 320px; }
.ws-stamp {
  text-align: center;
  padding: 12px;
  margin-bottom: 4px;
  border: 4px solid var(--coral);
  border-radius: 16px;
  transform: rotate(-2deg);
  color: var(--coral);
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 20px;
  background: rgba(255,111,89,0.06);
}

/* ---------- Susun Urutan ---------- */
.order-tip {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #8A7F9C;
  margin: 4px 0 12px;
}
.order-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.order-chip {
  position: relative;
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: var(--radius-md);
  padding: 14px 44px 14px 16px;
  text-align: left;
  box-shadow: var(--card-shadow);
  transition: transform 0.12s ease;
}
.order-chip:active { transform: translateY(3px); }
.order-chip .oc-arab { font-family: 'Amiri', serif; direction: rtl; font-size: 22px; }
.order-chip .oc-latin { font-family: 'Baloo 2', sans-serif; font-size: 12.5px; color: var(--teal-dark); margin-top: 2px; }
.order-chip .oc-badge {
  position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--paper-line);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 13px; color: var(--ink);
}
.order-chip.placed { background: var(--paper); }
.order-chip.placed .oc-badge { background: var(--yellow); }
.order-chip.right .oc-badge { background: var(--green); color: #fff; }
.order-chip.wrong .oc-badge { background: var(--coral); color: #fff; }
.order-chip:disabled { cursor: default; }
.order-actions { text-align: center; margin-top: 16px; }

/* ---------- Benar / Salah ---------- */
.tf-card {
  background: #fff;
  border: 3px dashed var(--ink);
  border-radius: var(--radius-lg);
  padding: 26px 18px;
  text-align: center;
  box-shadow: var(--card-shadow);
  margin: 14px 0 8px;
}
.tf-card .tf-arab { font-family: 'Amiri', serif; direction: rtl; font-size: 46px; color: var(--ink); }
.tf-card .tf-latin { font-family: 'Baloo 2', sans-serif; font-size: 18px; color: var(--teal-dark); margin-top: 8px; }
.tf-card .tf-hint { font-size: 12.5px; font-weight: 700; color: #8A7F9C; margin-top: 6px; }
.tf-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.tf-btn {
  border-radius: var(--radius-md);
  padding: 18px 10px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 800;
  font-size: 17px;
  box-shadow: var(--card-shadow);
  transition: transform 0.12s ease;
  color: #fff;
}
.tf-btn:active { transform: translateY(4px); }
.tf-btn.tf-yes { background: var(--green); }
.tf-btn.tf-no { background: var(--coral); }
.tf-btn:disabled { opacity: 0.5; }

/* ---------- Quiz ---------- */
.quiz-card {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 24px 20px;
  box-shadow: var(--card-shadow);
  text-align: center;
  margin-top: 14px;
}
.quiz-question { font-size: 15px; font-weight: 800; color: var(--teal-dark); margin-bottom: 4px; }
.hearts-row { font-size: 20px; letter-spacing: 3px; margin-bottom: 10px; }
.quiz-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}
.quiz-opt {
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: var(--radius-md);
  padding: 16px 8px;
  font-family: 'Baloo 2', sans-serif;
  font-size: 16px;
  font-weight: 700;
  transition: transform 0.12s ease;
}
.quiz-opt:active { transform: translateY(3px); }
.quiz-opt.correct { background: var(--green); color: #fff; border-color: var(--green); }
.quiz-opt.wrong { background: var(--coral); color: #fff; border-color: var(--coral); }

.quiz-feedback {
  min-height: 26px;
  font-weight: 800;
  font-family: 'Baloo 2', sans-serif;
  margin-top: 14px;
  color: var(--teal-dark);
}

.quiz-score {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--yellow);
  border-radius: 999px;
  padding: 6px 14px;
  font-weight: 800;
  font-family: 'Baloo 2', sans-serif;
}

.clue-box {
  background: var(--paper);
  border: 2px dashed var(--ink);
  border-radius: var(--radius-md);
  padding: 16px 14px;
  font-weight: 700;
  font-size: 14.5px;
  text-align: center;
  margin-top: 6px;
  color: var(--ink);
}

/* ---------- Memory match game ---------- */
.match-stats {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 14px 0;
  flex-wrap: wrap;
}
.match-stats .pill {
  background: #fff;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 6px 14px;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 14px;
}
.match-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
@media (min-width: 420px) {
  .match-grid { grid-template-columns: repeat(4, 1fr); }
}
.match-card {
  aspect-ratio: 1 / 1;
  border-radius: 16px;
  background: var(--teal);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  box-shadow: 0 4px 0 rgba(43,33,64,0.2);
  transition: transform 0.15s ease, background 0.15s ease;
  padding: 4px;
  text-align: center;
  word-break: break-word;
}
.match-card.face-latin { font-family: 'Baloo 2', sans-serif; font-size: 13px; }
.match-card.face-arab { font-family: 'Amiri', serif; font-size: 26px; }
.match-card.flipped { background: #fff; color: var(--ink); border: 2px solid var(--violet); }
.match-card.matched { background: var(--green); color: #fff; opacity: 0.85; cursor: default; }
.match-card:active { transform: scale(0.95); }

/* ---------- Celebration overlay ---------- */
.celebrate {
  position: fixed;
  inset: 0;
  background: rgba(43,33,64,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
}
.celebrate-card {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 32px 26px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 10px 0 rgba(0,0,0,0.15);
}
.celebrate-card .big-star { font-size: 56px; }
.celebrate-card h3 { font-size: 22px; color: var(--teal-dark); margin: 8px 0; }
.celebrate-card p { font-weight: 700; color: #6b6280; margin-bottom: 6px; }
.xp-earned {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--teal-dark);
  background: var(--paper);
  border-radius: 999px;
  padding: 6px 12px;
  display: inline-block;
  margin-bottom: 16px;
}
.celebrate-card .btn { width: 100%; margin-bottom: 10px; }

/* ---------- Footer note ---------- */
.audio-note {
  font-size: 12px;
  text-align: center;
  color: #8A7F9C;
  font-weight: 700;
  margin-top: 10px;
}

.footer-note {
  text-align: center;
  font-size: 12px;
  color: #ab9fc4;
  margin-top: 40px;
  font-weight: 700;
}

.hidden { display: none !important; }

@media (max-width: 360px) {
  .flashcard .arabic { font-size: 54px; }
  .menu-tile h3 { font-size: 15px; }
}
</style>

let state = { view: "dashboard", category: null, jilidId: null, cardIndex: 0, quiz: null, match: null, order: null, tf: null };

// ---------------- Progress (localStorage, tanpa akun) ----------------
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }
  catch (e) { /* localStorage tidak tersedia */ }
}
function resetAllProgress() {
  try {
    localStorage.removeItem(PROGRESS_KEY);
    localStorage.removeItem(XP_KEY);
    localStorage.removeItem(STREAK_KEY);
  } catch (e) { /* localStorage tidak tersedia */ }
}
function progKey(cat, modId) { return cat + ":" + modId; }
function getProgress(cat, modId) {
  const p = loadProgress();
  return p[progKey(cat, modId)] || { seen: [], selesai: false };
}
function markCardSeen(cat, modId, cardIdx) {
  const p = loadProgress();
  const key = progKey(cat, modId);
  if (!p[key]) p[key] = { seen: [], selesai: false };
  const isNew = !p[key].seen.includes(cardIdx);
  if (isNew) p[key].seen.push(cardIdx);
  const mod = APP_DATA[cat].modules.find((m) => m.id === modId);
  const wasSelesai = p[key].selesai;
  if (mod && p[key].seen.length >= mod.kartu.length) p[key].selesai = true;
  saveProgress(p);
  if (isNew) addXP(2);
  if (mod && p[key].selesai && !wasSelesai) addXP(15);
}
// Cek apakah sebuah modul terkunci (belum boleh diakses) — modul pertama
// dalam kategori selalu terbuka, modul berikutnya terbuka setelah modul
// sebelumnya "selesai" (semua kartunya sudah dipelajari).
function isModuleLocked(cat, modules, index) {
  if (index === 0) return false;
  const prevMod = modules[index - 1];
  return !getProgress(cat, prevMod.id).selesai;
}

  iqra:   { label: "Kak Iqra",   gender: "girl", bodyLight: "#ff9dc0", bodyDark: "#b23c72", wearLight: "#c9a6ff", wearDark: "#7c4fd1", pinColor: "#FFC93C" },
  iqbal:  { label: "Kak Iqbal",  gender: "boy",  bodyLight: "#6fb8ff", bodyDark: "#2f74c9", wearColor: "#fff8ea", bandColor: "#2f74c9" },
  zahra:  { label: "Kak Zahra",  gender: "girl", bodyLight: "#ffd166", bodyDark: "#e0932c", wearLight: "#7fe3d6", wearDark: "#2fa89a", pinColor: "#FF6F59" },
  faqih:  { label: "Kak Faqih",  gender: "boy",  bodyLight: "#b39dff", bodyDark: "#6b46c9", wearColor: "#4a2f1a", bandColor: "#FFC93C", glasses: true },
  aisyah: { label: "Kak Aisyah", gender: "girl", bodyLight: "#8fe0a0", bodyDark: "#2fa84f", wearLight: "#ffc2a1", wearDark: "#e0703c", pinColor: "#FFC93C" },
};
function getMascotChar() {
  const v = localStorage.getItem(MASCOT_KEY);
  return MASCOT_CHARACTERS[v] ? v : "iqro";
}
function setMascotChar(c) {
  try { localStorage.setItem(MASCOT_KEY, c); } catch (e) {}
}
function getXP() {
  const v = parseInt(localStorage.getItem(XP_KEY) || "0", 10);
  return isNaN(v) ? 0 : v;
}
function addXP(amount) {
  try {
    const total = getXP() + amount;
    localStorage.setItem(XP_KEY, String(total));
    bumpStreak();
  } catch (e) {}
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
function bumpStreak() {
  try {
    const data = JSON.parse(localStorage.getItem(STREAK_KEY) || "null") || { count: 0, last: null };
    const today = todayStr();
    if (data.last === today) return; // sudah dihitung hari ini
    const yest = new Date();
    yest.setDate(yest.getDate() - 1);
    const yestStr = yest.getFullYear() + "-" + (yest.getMonth() + 1) + "-" + yest.getDate();
    data.count = data.last === yestStr ? data.count + 1 : 1;
    data.last = today;
    localStorage.setItem(STREAK_KEY, JSON.stringify(data));
  } catch (e) {}
}
function getStreak() {
  try {
    const data = JSON.parse(localStorage.getItem(STREAK_KEY) || "null") || { count: 0, last: null };
    return data.count;
  } catch (e) { return 0; }
}

// ---------------- Audio suara huruf: Web Speech API ----------------
// Beberapa perangkat punya lebih dari satu suara Arab dengan kualitas berbeda-beda.
// Kita kumpulkan semua suara Arab yang tersedia, urutkan yang paling natural duluan,
// dan sediakan tombol untuk pindah suara / mengulang pelan-pelan kalau pelafalannya
// masih kurang pas di perangkat tertentu.
let arabicVoices = [];
let arabicVoiceIdx = 0;
const VOICE_IDX_KEY = "iqro-ceria-voice-idx";
function pickArabicVoice() {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  const isArabic = (v) => v.lang && v.lang.toLowerCase().startsWith("ar");
  const list = voices.filter(isArabic);
  // Prioritaskan suara lokal (biasanya lebih natural) & nama-nama suara Arab yang umum bagus.
  const goodNames = /naayf|hoda|majed|tarik|laila|maged|zeina|salma|google/i;
  list.sort((a, b) => {
    const score = (v) => (v.localService ? 2 : 0) + (goodNames.test(v.name) ? 1 : 0);
    return score(b) - score(a);
  });
  arabicVoices = list;
  const saved = parseInt(localStorage.getItem(VOICE_IDX_KEY) || "0", 10);
  arabicVoiceIdx = list.length ? Math.min(saved, list.length - 1) : 0;
}
if (window.speechSynthesis) {
  pickArabicVoice();
  window.speechSynthesis.onvoiceschanged = pickArabicVoice;
}
function currentArabicVoice() {
  return arabicVoices.length ? arabicVoices[arabicVoiceIdx] : null;
}
function cycleArabicVoice() {
  if (arabicVoices.length < 2) {
    showAudioNote("Perangkat ini cuma punya 1 suara Arab. Coba install suara Arab tambahan di pengaturan perangkat ya.");
    return;
  }
  arabicVoiceIdx = (arabicVoiceIdx + 1) % arabicVoices.length;
  localStorage.setItem(VOICE_IDX_KEY, String(arabicVoiceIdx));
  const v = currentArabicVoice();
  showAudioNote("Suara diganti ke: " + (v ? v.name : "default") + ". Coba dengarkan lagi ya!");
}
function speak(text, onEnd, rateOverride) {
  if (!window.speechSynthesis) {
    showAudioNote("Maaf, perangkat ini tidak mendukung suara. Coba pakai Chrome ya!");
    if (onEnd) onEnd();
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ar-SA";
  const v = currentArabicVoice();
  if (v) { utter.voice = v; utter.lang = v.lang; }
  utter.rate = rateOverride || 0.72;
  utter.pitch = 1.02;
  utter.onend = () => onEnd && onEnd();
  utter.onerror = () => {
    showAudioNote("Suara Arab belum tersedia di perangkat ini. Coba di Chrome versi terbaru (desktop/Android).");
    onEnd && onEnd();
  };
  window.speechSynthesis.speak(utter);
}
let audioNoteTimer = null;
function showAudioNote(msg) {
  const el = document.getElementById("audioNote");
  if (!el) return;
  el.textContent = msg;
  el.classList.remove("hidden");
  clearTimeout(audioNoteTimer);
  audioNoteTimer = setTimeout(() => el.classList.add("hidden"), 4500);
}

// ---------------- Musik latar ringan (Web Audio, tanpa file audio) ----------------
let musicOn = localStorage.getItem(MUSIC_KEY) !== "off";
let audioCtx = null;
let musicMaster = null;
let musicTimer = null;
function ensureCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  return audioCtx;
}
function startMusic() {
  if (!musicOn || musicTimer) return;
  const ctx = ensureCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume();
  musicMaster = ctx.createGain();
  musicMaster.gain.value = 0.05;
  musicMaster.connect(ctx.destination);
  const notes = [261.63, 293.66, 329.63, 392.0, 440.0, 392.0, 329.63, 293.66]; // pentatonis lembut
  let step = 0;
  musicTimer = setInterval(() => {
    if (!musicOn || !audioCtx) return;
    const freq = notes[step % notes.length];
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.3);
    o.connect(g);
    g.connect(musicMaster);
    o.start();
    o.stop(audioCtx.currentTime + 1.4);
    step++;
  }, 780);
}
function stopMusic() {
  if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  if (musicMaster) { try { musicMaster.disconnect(); } catch (e) {} musicMaster = null; }
}
function updateMusicPlayback() {
  if (state.view === "dashboard") startMusic();
  else stopMusic();
}
function updateMusicBtn() {
  const btn = document.getElementById("musicBtn");
  if (!btn) return;
  btn.textContent = musicOn ? "🎵" : "🔇";
  btn.classList.toggle("muted", !musicOn);
}
document.getElementById("musicBtn").addEventListener("click", () => {
  musicOn = !musicOn;
  localStorage.setItem(MUSIC_KEY, musicOn ? "on" : "off");
  updateMusicBtn();
  if (musicOn) updateMusicPlayback(); else stopMusic();
});
updateMusicBtn();
// beberapa browser memblokir autoplay audio sebelum ada interaksi pengguna;
// begitu pengguna menyentuh layar pertama kali, coba lanjutkan musik dashboard.
document.addEventListener("pointerdown", function resumeOnce() {
  const ctx = ensureCtx();
  if (ctx && ctx.state === "suspended") ctx.resume();
  updateMusicPlayback();
  document.removeEventListener("pointerdown", resumeOnce);
}, { once: true });

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// Ambil pilihan pengecoh (distractor) yang "gayanya" mirip dengan jawaban benar —
// supaya huruf tunggal tidak tercampur dengan kartu latihan gabungan huruf (yang
// berisi " - "), sehingga pilihan ganda terlihat rapi dan setara.
function pickDistractors(kartuArr, correctIdx, count) {
  const target = kartuArr[correctIdx];
  const isDrill = target.latin.includes(" - ");
  let pool = kartuArr.map((k, i) => i).filter((i) => i !== correctIdx && kartuArr[i].latin.includes(" - ") === isDrill);
  if (pool.length < count) pool = kartuArr.map((k, i) => i).filter((i) => i !== correctIdx);
  return shuffle(pool).slice(0, count);
}
function arabSizeClass(text) {
  const len = (text || "").length;
  if (len > 40) return "small";
  if (len > 16) return "medium";
  return "";
}

function bottomNav(active) {

    <div class="bottom-nav-spacer"></div>`;
}

// Cari modul "lanjutkan belajar" pertama yang belum tuntas di sebuah kategori,
// beserta kartu pertama yang belum pernah dilihat di modul tersebut.
function findContinueTarget(catKey) {
  const cat = APP_DATA[catKey];
  let target = cat.modules.find((m) => !getProgress(catKey, m.id).selesai) || cat.modules[cat.modules.length - 1];
  const prog = getProgress(catKey, target.id);
  let cardIndex = target.kartu.findIndex((k, i) => !prog.seen.includes(i));
  if (cardIndex === -1) cardIndex = 0;
  return { modId: target.id, cardIndex };
}

function render() {
  const darkViews = ["dashboard", "category-home", "progress", "favorit", "settings"];
  document.body.classList.toggle("dash-theme", darkViews.includes(state.view));
  if (state.view === "dashboard") renderDashboard();
  else if (state.view === "category-home") renderCategoryHome();
  else if (state.view === "progress") renderProgress();
  else if (state.view === "favorit") renderFavorit();
  else if (state.view === "settings") renderSettings();
  else if (state.view === "lesson") renderLesson();
  else if (state.view === "gamehub") renderGameHub();
  else if (state.view === "quiz") renderQuiz();
  else if (state.view === "match") renderMatch();
  else if (state.view === "order") renderOrder();
  else if (state.view === "tf") renderTF();
  else if (state.view === "sheet") renderSheet();
  attachGlobalHandlers();
  updateMusicPlayback();
}

// ---------------- GAME: Susun Urutan (tap sesuai urutan asli) ----------------
function startOrder(jilidId) {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === jilidId);
  const n = Math.min(5, mod.kartu.length);
  const startAt = mod.kartu.length > n ? Math.floor(Math.random() * (mod.kartu.length - n + 1)) : 0;
  const correctOrder = Array.from({ length: n }, (_, i) => startAt + i);
  state.view = "order";
  state.jilidId = jilidId;
  state.order = { correctOrder, display: shuffle(correctOrder), picks: [], total: n, done: false, reveal: false, xpGiven: false };
  render();
}
function renderOrder() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const o = state.order;

  if (o.done) {
    const right = o.picks.every((idx, i) => idx === o.correctOrder[i]);
    let stars = right ? 3 : (o.picks.filter((idx, i) => idx === o.correctOrder[i]).length >= Math.ceil(o.total / 2) ? 2 : 1);
    if (!o.xpGiven) { addXP(o.total * 3 + stars * 2); o.xpGiven = true; }
    renderCelebration(mod, { stars, right, total: o.total }, "order");
    return;
  }

  root.innerHTML = `
    ${topbar(mod.judul + " · Urutkan", true)}
    ${mascot("Ketuk kartu sesuai urutan yang benar, dari pertama sampai terakhir ya! 🔢", "point")}
    <div class="order-tip">${o.reveal ? "Ini urutan pilihanmu:" : `Langkah ke-${o.picks.length + 1} dari ${o.total}`}</div>
    <div class="order-grid" id="orderGrid">
      ${o.display.map((idx) => {
        const placedAt = o.picks.indexOf(idx);
        const placed = placedAt !== -1;
        let cls = placed ? "placed" : "";
        if (o.reveal && placed) cls += placedAt === o.correctOrder.indexOf(idx) ? " right" : " wrong";
        return `<button class="order-chip ${cls}" data-idx="${idx}" disabled>
          <div class="oc-arab">${mod.kartu[idx].arab}</div>
          <div class="oc-latin">${mod.kartu[idx].latin}</div>
          ${placed ? `<span class="oc-badge">${placedAt + 1}</span>` : `<span class="oc-badge">?</span>`}
        </button>`;
      }).join("")}
    </div>
  `;

  if (!o.reveal) {
    document.querySelectorAll(".order-chip").forEach((btn) => {
      btn.disabled = false;
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.idx);
        o.picks.push(idx);
        speak(mod.kartu[idx].arab);
        if (o.picks.length >= o.total) { o.reveal = true; render(); setTimeout(() => { o.done = true; render(); }, 1400); }
        else render();
      });
    });
  }
}

// ---------------- GAME: Lembar Latihan (bergaya lembar kerja/worksheet) ----------------
function startSheet(jilidId) {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === jilidId);
  const total = Math.min(8, mod.kartu.length);
  const pool = shuffle(mod.kartu.map((k, i) => i)).slice(0, total);
  const questions = pool.map((idx) => {
    const distractors = pickDistractors(mod.kartu, idx, 3);
    const options = shuffle([idx, ...distractors]);
    return { cardIdx: idx, options, chosen: null };
  });
  state.view = "sheet";
  state.jilidId = jilidId;
  state.sheet = { questions, submitted: false, xpGiven: false };
  render();
}
function renderSheet() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const s = state.sheet;
  const semuaTerjawab = s.questions.every((q) => q.chosen !== null);
  const benar = s.questions.filter((q) => q.chosen === q.cardIdx).length;
  const total = s.questions.length;
  const persen = Math.round((benar / total) * 100);
  const bintang = persen >= 90 ? 3 : persen >= 60 ? 2 : 1;

  if (s.submitted && !s.xpGiven) { addXP(benar * 3 + bintang * 2); s.xpGiven = true; }

  const holes = Array.from({ length: 8 }, () => `<span></span>`).join("");

  const rows = s.questions.map((q, i) => {
    const kartu = mod.kartu[q.cardIdx];
    const numCls = !s.submitted ? "" : q.chosen === q.cardIdx ? "correct" : "wrong";
    const numIcon = !s.submitted ? String(i + 1) : q.chosen === q.cardIdx ? "✓" : "✗";
    const opts = q.options.map((optIdx, oi) => {
      const letter = ["A", "B", "C", "D"][oi];
      let cls = q.chosen === optIdx ? "selected" : "";
      if (s.submitted) {
        if (optIdx === q.cardIdx) cls += " correct";
        else if (q.chosen === optIdx) cls += " wrong";
      }
      return `<button class="ws-opt ${cls}" data-q="${i}" data-opt="${optIdx}" ${s.submitted ? "disabled" : ""}>
        <b>${letter}.</b> ${mod.kartu[optIdx].latin}
      </button>`;
    }).join("");
    return `
      <div class="ws-q">
        <div class="ws-q-head">
          <span class="ws-q-num ${numCls}">${numIcon}</span>
          <span class="ws-q-arab ${arabSizeClass(kartu.arab)}">${kartu.arab}</span>
        </div>
        <div class="ws-options">${opts}</div>
      </div>`;
  }).join("");

  root.innerHTML = `
    ${topbar(mod.judul + " · Lembar Latihan", true)}
    ${mascot(s.submitted ? "Sudah selesai dikoreksi! Lihat hasilnya di atas ya 📝" : "Kerjakan tiap nomor, lalu tekan Periksa Jawaban kalau sudah selesai semua! ✏️", "read")}
    ${s.submitted ? `
      <div class="ws-stamp">
        NILAI ${persen} ${"⭐".repeat(bintang)}${"☆".repeat(3 - bintang)}
        <div style="font-size:12px;font-weight:700;margin-top:4px">Benar ${benar} dari ${total} soal</div>
      </div>` : ""}
    <div class="worksheet-paper">
      <div class="worksheet-holes">${holes}</div>
      <div class="ws-title">📝 Lembar Latihan — ${mod.judul}</div>
      <div class="ws-instruction">Lingkari (tap) jawaban A/B/C/D yang paling tepat untuk tiap nomor ya!</div>
      ${rows}
    </div>
    <div class="ws-submit-row">
      ${s.submitted
        ? `<button class="btn btn-primary" id="btnSheetUlangi">Kerjakan Lagi 🔁</button>
           <button class="btn btn-secondary" id="btnSheetGameLain" style="margin-top:10px">Main Game Lain 🎮</button>`
        : `<button class="btn btn-ok" id="btnSheetSubmit" ${semuaTerjawab ? "" : "disabled"}>Periksa Jawaban ✓</button>
           <p style="font-size:12px;color:#8A7F9C;font-weight:700;margin-top:8px">${semuaTerjawab ? "Semua sudah dijawab, yuk periksa!" : "Jawab semua nomor dulu ya (" + s.questions.filter(q=>q.chosen!==null).length + "/" + total + ")"}</p>`}
    </div>
  `;

  if (!s.submitted) {
    document.querySelectorAll(".ws-opt").forEach((btn) => {
      btn.addEventListener("click", () => {
        const qi = Number(btn.dataset.q);
        const oi = Number(btn.dataset.opt);
        s.questions[qi].chosen = oi;
        render();
      });
    });
    const submitBtn = document.getElementById("btnSheetSubmit");
    if (submitBtn) submitBtn.addEventListener("click", () => { s.submitted = true; render(); });
  } else {
    document.getElementById("btnSheetUlangi").addEventListener("click", () => startSheet(mod.id));
    document.getElementById("btnSheetGameLain").addEventListener("click", () => { state.view = "gamehub"; render(); });
  }
}

// ---------------- GAME: Benar atau Salah (tebak cepat) ----------------
function startTF(jilidId) {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === jilidId);
  const total = Math.min(6, mod.kartu.length);
  const pool = shuffle(mod.kartu.map((k, i) => i)).slice(0, total);
  const rounds = pool.map((idx) => {
    const isTrue = Math.random() < 0.5 || mod.kartu.length < 2;
    let shownLatin = mod.kartu[idx].latin;
    if (!isTrue) {
      const others = mod.kartu.map((k, i) => i).filter((i) => i !== idx);
      const swapIdx = pick(others);
      shownLatin = mod.kartu[swapIdx].latin;
    }
    return { idx, shownLatin, isTrue };
  });
  state.view = "tf";
  state.jilidId = jilidId;
  state.tf = { rounds, index: 0, score: 0, total, answered: false, hearts: 3, xpGiven: false };
  render();
}
function renderTF() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const t = state.tf;
  const kehabisanNyawa = t.hearts <= 0;
  if (t.index >= t.total || kehabisanNyawa) {
    if (!t.xpGiven) { addXP(t.score * 4 + (kehabisanNyawa ? 0 : 5)); t.xpGiven = true; }
    renderCelebration(mod, { score: t.score, total: t.total, kehabisan: kehabisanNyawa }, "tf");
    return;
  }

  const r = t.rounds[t.index];
  const kartu = mod.kartu[r.idx];

  root.innerHTML = `
    ${topbar(mod.judul + " · Benar/Salah", true)}
    ${mascot("Perhatikan baik-baik, lalu tebak: benar atau salah? ⚡", "search")}
    <div class="hearts-row" style="text-align:center">${"❤️".repeat(t.hearts)}${"🤍".repeat(3 - t.hearts)}</div>
    <div class="quiz-question" style="text-align:center;margin-bottom:6px">Soal ${t.index + 1} dari ${t.total}</div>
    <div class="tf-card">
      <div class="tf-arab">${kartu.arab}</div>
      <div class="tf-latin">${r.shownLatin}</div>
      <div class="tf-hint">Apakah tulisan latin di atas cocok dengan bacaan Arabnya?</div>
    </div>
    <div class="tf-buttons">
      <button class="tf-btn tf-yes" data-ans="true">Benar ✅</button>
      <button class="tf-btn tf-no" data-ans="false">Salah ❌</button>
    </div>
    <div class="quiz-feedback" id="quizFeedback" style="text-align:center"></div>
    <div style="text-align:center;margin-top:10px"><span class="quiz-score">⭐ ${t.score}/${t.total}</span></div>
  `;

  document.querySelectorAll(".tf-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (t.answered) return;
      t.answered = true;
      document.querySelectorAll(".tf-btn").forEach((b) => (b.disabled = true));
      const chosen = btn.dataset.ans === "true";
      const feedback = document.getElementById("quizFeedback");
      if (chosen === r.isTrue) {
        t.score += 1;
        feedback.textContent = pick(MASKOT_KATA.benar);
      } else {
        feedback.textContent = pick(MASKOT_KATA.salah);
        t.hearts -= 1;
      }
      setTimeout(() => { t.index += 1; t.answered = false; renderTF(); }, 1300);
    });
  });
}

}
function renderQuiz() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const q = state.quiz;
  const kehabisanNyawa = q.hearts <= 0;
  if (q.index >= q.total || kehabisanNyawa) {

  const cardIdx = q.pool[q.index];

  root.innerHTML = `

    <div class="quiz-card">
      <div class="hearts-row">${"❤️".repeat(q.hearts)}${"🤍".repeat(3 - q.hearts)}</div>
      <div class="quiz-question">Soal ${q.index + 1} dari ${q.total}</div>
      ${isAudio ? `<button class="speaker-btn" id="btnSpeakQuiz" aria-label="Dengarkan pelafalan">🔊</button>` : `<div class="clue-box">${kartu.ket}</div>`}
      <div class="quiz-options" id="quizOptions">

      </div>

  if (isAudio) {

    speakBtn.addEventListener("click", doSpeak);
    setTimeout(doSpeak, 300);
  }

  document.querySelectorAll(".quiz-opt").forEach((btn) => {
    btn.addEventListener("click", () => {

        feedback.textContent = pick(MASKOT_KATA.benar);

        btn.classList.add("wrong");
        document.querySelector(`.quiz-opt[data-idx="${cardIdx}"]`).classList.add("correct");
        feedback.textContent = pick(MASKOT_KATA.salah);
        q.hearts -= 1;
      }
      setTimeout(() => { q.index += 1; q.answered = false; renderQuiz(); }, 1400);
    });
  });
}

// ---------------- GAME: Cocok Kartu (memory match) ----------------
function startMatch(jilidId) {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === jilidId);
  const n = Math.min(6, mod.kartu.length);
  const chosen = shuffle(mod.kartu.map((k, i) => i)).slice(0, n);
  let cards = [];
  chosen.forEach((idx) => {
    cards.push({ uid: idx + "-a", idx, type: "arab" });
    cards.push({ uid: idx + "-l", idx, type: "latin" });
  });
  cards = shuffle(cards);
  state.view = "match";
  state.jilidId = jilidId;
  state.match = { cards, flipped: [], matched: [], moves: 0, busy: false, total: n, xpGiven: false };
  render();
}
function renderMatch() {
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  const m = state.match;

  if (m.matched.length === m.cards.length) {
    const maxMoves = m.total + 2;
    let stars = 1;
    if (m.moves <= maxMoves) stars = 3;
    else if (m.moves <= maxMoves + 3) stars = 2;
    if (!m.xpGiven) { addXP(m.total * 3 + stars * 2); m.xpGiven = true; }
    renderCelebration(mod, { moves: m.moves, stars }, "match");
    return;
  }

  root.innerHTML = `
    ${topbar(mod.judul + " · Cocok Kartu", true)}
    ${mascot("Buka dua kartu, cari pasangannya! 🧩", "puzzle")}
    <div class="match-stats">
      <span class="pill">🔁 Langkah: ${m.moves}</span>
      <span class="pill">✅ ${m.matched.length / 2}/${m.total} pasang</span>
    </div>
    <div class="match-grid" id="matchGrid">
      ${m.cards.map((c, pos) => {
        const isMatched = m.matched.includes(c.uid);
        const isFlipped = m.flipped.some((f) => f.uid === c.uid) || isMatched;
        const label = isFlipped
          ? (c.type === "arab" ? mod.kartu[c.idx].arab : mod.kartu[c.idx].latin)
          : "❓";
        const faceClass = isFlipped ? (c.type === "arab" ? "face-arab" : "face-latin") : "";
        return `<button class="match-card ${isFlipped ? "flipped" : ""} ${isMatched ? "matched" : ""} ${faceClass}"
                  data-pos="${pos}" ${isMatched ? "disabled" : ""}>${label}</button>`;
      }).join("")}
    </div>
    <div class="audio-note hidden" id="audioNote"></div>
  `;

  document.querySelectorAll(".match-card").forEach((btn) => {
    btn.addEventListener("click", () => onMatchCardClick(Number(btn.dataset.pos)));
  });
}
function onMatchCardClick(pos) {
  const m = state.match;
  const cat = APP_DATA[state.category];
  const mod = cat.modules.find((j) => j.id === state.jilidId);
  if (m.busy) return;
  const card = m.cards[pos];
  if (m.matched.includes(card.uid)) return;
  if (m.flipped.some((f) => f.uid === card.uid)) return;
  if (m.flipped.length >= 2) return;

  m.flipped.push(card);
  render();

  if (m.flipped.length === 2) {
    m.busy = true;
    m.moves += 1;
    const [a, b] = m.flipped;
    const isMatch = a.idx === b.idx && a.type !== b.type;
    if (isMatch) {
      setTimeout(() => {
        m.matched.push(a.uid, b.uid);
        m.flipped = [];
        m.busy = false;
        speak(mod.kartu[a.idx].arab);
        render();
      }, 500);
    } else {
      setTimeout(() => {
        m.flipped = [];
        m.busy = false;
        render();
      }, 900);
    }
  }
}

// ---------------- Celebration ----------------
const CELEB_TITLE = { quiz: "Kuis Selesai!", match: "Semua Kartu Cocok!", order: "Urutan Selesai!", tf: "Tebakan Selesai!" };
const CELEB_START = { quiz: startQuiz, match: startMatch, order: startOrder, tf: startTF };
function renderCelebration(mod, result, kind) {
  const gagalNyawa = (kind === "quiz" || kind === "tf") && result.kehabisan;
  const title = gagalNyawa ? "Nyawa Habis!" : (CELEB_TITLE[kind] || "Selesai!");
  let desc = "";
  if (kind === "quiz" || kind === "tf") {
    desc = gagalNyawa
      ? `Jangan sedih, kamu tetap dapat skor ${result.score} dari ${result.total}. Yuk coba lagi! 💪`
      : `Skor kamu: ${result.score} dari ${result.total} (${Math.round((result.score / result.total) * 100)}%)`;
  } else if (kind === "match") {
    desc = `Selesai dalam ${result.moves} langkah — ${"⭐".repeat(result.stars)}`;
  } else if (kind === "order") {
    desc = result.right
      ? `Semua urutan kamu benar! ${"⭐".repeat(result.stars)}`
      : `Belum semua urutannya pas, yuk coba lagi! ${"⭐".repeat(result.stars)}`;
  }

  root.innerHTML = `
    ${topbar(mod.judul, true)}
    ${mascot(gagalNyawa ? "Tidak apa-apa, semua orang pasti pernah salah. Ayo coba lagi! 🤗" : pick(MASKOT_KATA.selesaiJilid), gagalNyawa ? "point" : "trophy")}
    <div class="celebrate">
      <div class="celebrate-card">
        <div class="big-star">${gagalNyawa ? "💛" : "🏆"}</div>
        <h3>${title}</h3>
        <p>${desc}</p>
        <div class="xp-earned">✨ Total XP kamu sekarang: ${getXP()}</div>
        <button class="btn btn-primary" id="btnUlangi">Main Lagi 🔁</button>
        <button class="btn btn-secondary" id="btnGameLain">Main Game Lain 🎮</button>
        <button class="btn btn-secondary" id="btnKeRak">Kembali ke Rak 📚</button>
      </div>
    </div>
  `;
  document.getElementById("btnUlangi").addEventListener("click", () => {
    (CELEB_START[kind] || startQuiz)(mod.id);
  });
  document.getElementById("btnGameLain").addEventListener("click", () => { state.view = "gamehub"; render(); });
  document.getElementById("btnKeRak").addEventListener("click", () => { state.view = "category-home"; render(); });
}

// ---------------- Global handlers ----------------
function attachGlobalHandlers() {
  const back = document.getElementById("btnBack");
  if (back) {
    back.addEventListener("click", () => {
      if (state.view === "quiz" || state.view === "match" || state.view === "order" || state.view === "tf" || state.view === "sheet") state.view = "gamehub";
      else if (state.view === "gamehub" || state.view === "lesson") state.view = "category-home";
      else state.view = "dashboard";
      render();
    });
  }
  document.querySelectorAll("[data-nav]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.nav;
      if (key === "main") state.view = "dashboard";
      else if (key === "belajar") { state.category = "iqro"; state.view = "category-home"; }
      else if (key === "reward") state.view = "progress";
      else if (key === "favorit") state.view = "favorit";
      else if (key === "pengaturan") state.view = "settings";
      render();
    });
  });
}

render();
</script>
</body>
</html>
